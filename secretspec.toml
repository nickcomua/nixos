#:schema https://secretspec.dev/schema/secretspec.schema.json

# Declarations only. Values stay in secrets.yaml (sops-nix) and, for machine
# secrets, in the Bitwarden Secrets Manager project this host token can access.
# Every sops-backed secret uses ref so writes stay on the flat root keys
# sops-nix already decrypts. Do not secretspec set a key without that ref:
# a convention write nests [project][profile][key] and breaks activation.

[project]
name = "nixos-config"
revision = "1.0"

[providers.sops]
uri = "sops://secrets.yaml"

[providers.bws]
uri = "bws://vault.bitwarden.eu@2c5e48e2-fca9-43de-a82f-b4b300e34a75"

[profiles.nixos.defaults]
inherit = false
providers = ["sops", "bws"]

[profiles.nixos]
gmail_push_token = { description = "Gmail push token", ref = { item = "gmail-push-token" } }
telegram_bot_token = { description = "Telegram bot token", ref = { item = "telegram-bot-token" } }
# Bootstrap credential for the bws provider. Never mirror this into BWS.
BWS_ACCESS_TOKEN = { description = "Bitwarden Secrets Manager machine token", providers = ["sops"], ref = { item = "BWS_ACCESS_TOKEN" } }

[profiles.alta.defaults]
inherit = false
providers = ["sops", "bws"]

[profiles.alta]
ssd_doda_bot_tg_api_id = { description = "SSD DODA Telegram API id", ref = { item = "ssd-doda-bot-tg-api-id" } }
ssd_doda_bot_tg_api_hash = { description = "SSD DODA Telegram API hash", ref = { item = "ssd-doda-bot-tg-api-hash" } }
ssd_doda_bot_tg_bot_token = { description = "SSD DODA Telegram bot token", ref = { item = "ssd-doda-bot-tg-bot-token" } }
BWS_ACCESS_TOKEN = { description = "Bitwarden Secrets Manager machine token", providers = ["sops"], ref = { item = "BWS_ACCESS_TOKEN" } }
GRAFANA_SECRET_KEY = { description = "Grafana secret key", providers = ["bws"], ref = { item = "GRAFANA_SECRET_KEY" } }
GRAFANA_ADMIN_PASSWORD = { description = "Grafana admin password", providers = ["bws"], ref = { item = "GRAFANA_ADMIN_PASSWORD" } }
ALTA_WEBDAV_PASSWORD = { description = "Alta WebDAV password", providers = ["bws"], ref = { item = "ALTA_WEBDAV_PASSWORD" } }

# Scopes are not nested under a profile. `secretspec run --profile alta --scope grafana`
# resolves the intersection, and strips every other secret from the child environment.
# BWS_ACCESS_TOKEN is a provider credential, not a service secret, so it is in no scope.

[scopes.gmail]
secrets = ["gmail_push_token"]

[scopes.telegram]
secrets = ["telegram_bot_token"]

[scopes.ssd-doda-bot]
secrets = ["ssd_doda_bot_tg_api_id", "ssd_doda_bot_tg_api_hash", "ssd_doda_bot_tg_bot_token"]

[scopes.grafana]
secrets = ["GRAFANA_SECRET_KEY", "GRAFANA_ADMIN_PASSWORD"]

[scopes.webdav]
secrets = ["ALTA_WEBDAV_PASSWORD"]

